<div #targetContainer class="target">
  @for (item of svgsSignal() | keyvalue; track item.key) {
    <div
      class="container"
      [class.best]="(item.value.grade >= 8)"

      [style.left.%]="50 + (item.value.x ?? 0)"
      [style.top.%]="50 + (item.value.y ?? 0)"
      [style.z-index]="item.value.z ?? 0"

      [style.--float-x]="item.value.floatX + 'px'"
      [style.--float-y]="item.value.floatY + 'px'"
      [style.--float-duration]="item.value.floatDuration + 's'"
      [style.--float-delay]="item.value.floatDelay + 's'"
      [style.--shine-duration]="item.value.shineDuration + 's'"

    >
    @if (item.value.type === 'word') {
      <p
        [class]="['element', item.value.type]"
      >
        {{ item.value.data }}
    </p>
      
    }@else{
      <img
        [class]="['element', item.value.type]"

        [src]="item.value.data"
        [alt]="item.key"
      >
    }
    </div>
  }
</div>

<h2>{{ title }}</h2>
