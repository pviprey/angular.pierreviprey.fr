<div #targetContainer class="target" style="position: relative; width: 100%; height: 100%">
  @for (item of svgs | keyvalue; track item.key) {
    <img [style]="{
        'position': 'absolute',
        'left': `calc(50% + ${item.value.x}%)`,
        'top': `calc(50% + ${item.value.y}%)`,
        'transform': 'translate(-50%, -50%)',
        'z-index': `${item.value.grade}`
    }" class="icon shadowed" [src]="item.value.path" [alt]="item.key">
  }
</div>
<h3>{{title}}</h3>
